name: ci

on:
  pull_request:
  push:
    branches: [main, 'release/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        # Full history: MintPlayer.Versioning.MSBuild reads each version from the tags reachable from HEAD.
        with:
          fetch-depth: 0
      - run: echo "building ${{ github.ref }}" && grep TargetFramework src/SparkTest.Lib/SparkTest.Lib.csproj
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview
      - name: Version the packages
        id: versioning
        uses: MintPlayer/MintPlayer.Spark/apps/CodeCoverage/versioning-action@ba2aa8ae024d8f2ac9e50a2a0689d8e638f86e0a # versioning-v1
      # With release lines on, the default branch tags nothing: a package with no tag yet would fail its
      # pack (MPV005). The release lines pack and publish; the default branch only when it released.
      - name: Decide whether this run publishes
        id: publishes
        env:
          RELEASED: ${{ steps.versioning.outputs.released }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ] && { [ -z "$RELEASED" ] || [ "$RELEASED" = "[]" ]; }; then
            echo "The default branch released nothing (release lines on, or no change): no pack, no publish."
            echo "value=false" >> "$GITHUB_OUTPUT"
          else
            echo "value=true" >> "$GITHUB_OUTPUT"
          fi
      # Sandbox: packs only, nothing is pushed to a registry.
      # No --no-build: the versions are decided after the tests, so pack builds again to stamp them into the
      # assemblies (--no-build also skips restore, which leaves the nuspec's dependency versions stale).
      # With release lines the default branch tags nothing, so only a line's run has a version to pack.
      - if: startsWith(github.ref, 'refs/heads/release/')
        run: dotnet pack src/SparkTest.Lib/SparkTest.Lib.csproj -c Release -o artifacts
